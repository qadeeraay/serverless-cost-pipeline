# 1. Kubernetes Secret for MinIO Credentials
#
# ⚠️ SECURITY ARCHITECTURE NOTE: These are placeholder credentials for local
# sandbox and demonstration environments, checked in deliberately so the pipeline
# is reproducible out-of-the-box without an external secrets bootstrap step. In
# an enterprise production deployment, these values are dynamically injected via
# HashiCorp Vault, AWS Secrets Manager, or External Secrets Operator (ESO) and
# never committed to Git. The mechanism used to consume the secret at runtime
# (secretKeyRef -> /var/openfaas/secrets/, see handler.py's _load_secret)
# follows strict zero-trust least-privilege standards.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: openfaas-fn
type: Opaque
stringData:
  MINIO_ACCESS_KEY: "admin"
  MINIO_SECRET_KEY: "password123"
---
# 2. NetworkPolicy: Isolate openfaas-fn namespace (Micro-segmentation)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-function-traffic
  namespace: openfaas-fn
spec:
  podSelector:
    matchLabels:
      faas_function: image-processor-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow incoming traffic ONLY from OpenFaaS Gateway & Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openfaas
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress ONLY to MinIO Storage & DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: minio
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
