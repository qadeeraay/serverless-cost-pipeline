apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pipeline-daily-backup
  namespace: velero
spec:
  # Daily at 02:00 AM UTC
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - openfaas
      - openfaas-fn
      - nats
      - minio
    ttl: 720h0m0s # 30 days retention
    storageLocation: default
    snapshotVolumes: false
