name: 🛡️ Scheduled DevSecOps & FinOps Compliance Audit

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC (Aligns with Velero backup schedule)
  workflow_dispatch:

jobs:
  audit:
    name: 🏆 Automated DevSecOps & FinOps Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install minio Pillow urllib3 requests nats-py

      - name: 🛡️ Execute Master DevSecOps & FinOps Audit Suite
        run: |
          chmod +x cluster_manage.sh
          ./cluster_manage.sh audit
