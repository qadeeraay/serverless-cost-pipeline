# 🛡️ Enterprise Kyverno Admission Controller Policy
# Enforces Cosign NIST P-256 ECDSA Digital Signature Verification on All Container Images
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-cosign-container-signature
  annotations:
    policies.kyverno.io/title: Verify Cosign Signature
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Cryptographically verifies that container images deployed into the openfaas-fn
      namespace are signed by Qadeer Aslam (qadeer016) using the authorized NIST P-256 ECDSA key.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: verify-image-processor-signature
    match:
      any:
      - resources:
          namespaces:
          - openfaas-fn
          kinds:
          - Pod
          - Deployment
    verifyImages:
    - imageReferences:
      - "docker.io/qadeer016/image-processor-app:*"
      - "*image-processor-app*"
      attestors:
      - entries:
        - keys:
            publicKeys: |
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE+oznV2HrgBr+0Tc/TZCGNlwlsyIx
              7EiOT1ITHnZ6we0RvG24HUTrk2svRrAZc31ylCy0jY5DYM31+LNcTNhKHg==
              -----END PUBLIC KEY-----
